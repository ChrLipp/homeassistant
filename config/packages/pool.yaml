input_boolean:
  sommermodus:
    name: Gibt an, ob der Sommermodus aktiv ist
    icon: mdi:pool

# Dadurch, dass ich Netzwerk im Poolraum gebraucht habe, habe ich eine zweipolige Stromleitung zur Übertragung des Netzwerkes über Fritz! Powerline benutzt.
# Diese Leitung war früher für die Übertragung der Pool-Heizung zuständig, diese Funktion habe ich damit verloren.
# Den Ersatz der Leitung habe ich wie folgt durchgeführt:
# - Im Pool-Technikraum gibt es den switch.power_01, der am Strom hängt, wenn geheizt werden soll
# - Dann registriert er sich über WLAN beim HomeAssistant
# - Die folgende Automatisierung läuft an und schaltet ein Relay im Heizungskeller
# - Das Relai führt die ursprüngliche Aktion der Heizungs-Leitung durch.
automation:
- id: 'pool_heater_on'
  alias: 'Service: Pool heater on'
  trigger:
  - platform: state
    entity_id: switch.power_01
    from: "unavailable"
  condition:
  - condition: state
    entity_id: input_boolean.sommermodus
    state: 'on'
  action:
  - service: switch.turn_on
    target:
      entity_id: switch.ventilation_relay_4
  mode: single

- id: 'pool_heater_off'
  alias: 'Service: Pool heater off'
  trigger:
  - platform: state
    entity_id: switch.power_01
    to: "unavailable"
  condition:
  - condition: state
    entity_id: input_boolean.sommermodus
    state: 'on'
  action:
  - service: switch.turn_off
    target:
      entity_id: switch.ventilation_relay_4
  mode: single

# Nur ein Modi erlaubt, hätte auch in xmas.yaml sein können
# Sommer- und Weihnachtsmodus schließen sich gegenseitig aus
- id: 'mutual_exclusive_summer_xmas'
  alias: 'Service: Summer and x-mas mode are mutually exclusive'
  triggers:
  - trigger: state
    entity_id: input_boolean.sommermodus
    to: 'on'
    id: 'summer_on'
  - trigger: state
    entity_id: input_boolean.weihnachtsmodus
    to: 'on'
    id: 'xmas_on'
  action:
  - choose:
      - conditions:
          - condition: trigger
            id: 'summer_on'
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.weihnachtsmodus
      - conditions:
          - condition: trigger
            id: 'xmas_on'
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.sommermodus
  mode: single
